<!DOCTYPE html>
<html lang="tr" class="js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bu kare boş — Waffle Mina</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EF7B02">
  <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; padding: 48px var(--gutter); background: var(--orange); }
    .lost__grid { --cell: min(26vw, 22svh, 190px); --gap: calc(var(--cell) * .14); display: grid; grid-template-columns: repeat(3, var(--cell)); grid-auto-rows: var(--cell); gap: var(--gap); }
    .lost__empty { background: transparent; box-shadow: inset 0 0 0 3px var(--ink); }
    .lost__logo { display: grid; place-items: center; }
    .lost__logo img { width: 84%; transform: rotate(-7deg); }
    .lost__text { margin-top: 36px; text-align: center; }
    .lost__text .crisp { display: block; font-size: min(11vw, 84px); }
    .lost__text .soft { display: block; margin-top: .1em; font-size: min(11vw, 88px); }
    .lost__cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; margin-top: 28px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <div class="lost__grid" aria-hidden="true">
        <span class="pocket"></span><span class="pocket"></span><span class="pocket lost__logo"><img src="/assets/brand/logo.webp" width="255" height="256" alt=""></span>
        <span class="pocket"></span><span class="pocket lost__empty"></span><span class="pocket"></span>
        <span class="pocket"></span><span class="pocket"></span><span class="pocket"></span>
      </div>
      <h1 class="lost__text"><span class="crisp">BU KARE</span> <span class="soft">boş.</span></h1>
      <div class="lost__cta">
        <a class="btn btn--ink btn--lg" href="/">Ana sayfaya dön</a>
        <a class="link" href="https://wafflemina.adisyonqr.com/" target="_blank" rel="noopener">QR menü <span aria-hidden="true">↗</span><span class="sr"> (yeni sekmede açılır)</span></a>
      </div>
    </div>
  </main>
</body>
</html>
